name: Тысяча — пробный запуск Telegram

on:
  push:
    branches: [test/tysyacha-telegram-live]

permissions:
  contents: read

concurrency:
  group: tysyacha-telegram-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: tysyacha
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Установить зависимости и прогнать тесты
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Проверить токен в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.TELEGRAM_BOT_TOKEN?.trim();
          if (!token) {
            console.error('Секрет TELEGRAM_BOT_TOKEN недоступен этому запуску.');
            process.exit(1);
          }

          async function call(method) {
            const response = await fetch('https://api.telegram.org/bot' + token + '/' + method, {
              signal: AbortSignal.timeout(10000),
            });
            const data = await response.json();
            if (!response.ok || !data.ok) {
              throw new Error(method + ' вернул HTTP ' + response.status);
            }
            return data.result;
          }

          try {
            const bot = await call('getMe');
            console.log('::add-mask::@' + bot.username);
            if ((await call('getWebhookInfo')).url) {
              console.error('У бота уже настроен webhook. Пробный запуск остановлен.');
              process.exit(1);
            }
            console.log('Telegram принял токен. Запускается пробная сессия.');
          } catch (error) {
            console.error('Проверка Telegram завершилась ошибкой:', error.message);
            process.exit(1);
          }
          JS
      - name: Открыть столы на 30 минут
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -o pipefail
          status=0
          timeout --signal=TERM --kill-after=10s 30m node --import tsx src/bot/index.ts | sed -u -E 's/@[A-Za-z0-9_]+/[bot]/g' || status=$?
          if [ "$status" -ne 124 ]; then
            echo "Пробная сессия завершилась раньше времени (код $status)."
            exit 1
          fi
          echo 'Пробная сессия завершена через 30 минут.'
